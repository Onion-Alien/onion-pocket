name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # scan the whole history, not just the tip
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Personal data and secrets (repo rules)
        run: python scripts/check_sensitive.py --history
      # A commit's time zone says where its author is: new commits must be in UTC
      # (CLAUDE.md, "Commit times"). A PR: its commits not on main yet, and it fails.
      # main: what the push added is only a warning, as it's pushed already and can't
      # be re-stamped. Three commits from before this check still carry a time zone.
      - name: Commit times in UTC
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            sh scripts/check_utc.sh "$PR_HEAD" --not origin/main
          elif ! sh scripts/check_utc.sh "$BEFORE..$AFTER"; then
            echo "::warning::A commit on this push isn't in UTC: merge with scripts/merge_pr.sh, not gh pr merge or the Merge button."
          fi
      # The CLI rather than gitleaks-action: the action scans `<first commit>^..`,
      # which errors on a repo's first push (the root commit has no parent).
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar xzf "$tarball" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: The add-on builds (only imports Onion Board ships)
        run: python scripts/build_module.py
